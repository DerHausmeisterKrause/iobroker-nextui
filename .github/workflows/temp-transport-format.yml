name: Temporary NextUI transport formatting
on:
  push:
    branches: [feat/nextui-direct-http-https]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nextui-direct-http-https
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format changed transport files
        run: |
          npx prettier --write src/main.ts src/server-tls.ts src/server-tls.test.ts src/server-https.test.ts src/web-server.ts src/lib/adapter-config.d.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/server-tls.ts src/server-tls.test.ts src/server-https.test.ts src/web-server.ts src/lib/adapter-config.d.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format native HTTP and HTTPS transport"
            git push origin HEAD:feat/nextui-direct-http-https
          fi
