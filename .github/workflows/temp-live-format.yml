name: Temporary format live events
on:
  push:
    branches: [feat/nextui-live-events]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nextui-live-events
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply project formatting
        run: |
          npx prettier --write src/datapoint-live-hub.ts src/datapoint-live-hub.test.ts src/datapoint-live-http.test.ts src/main.ts src/web-server.ts apps/frontend/src/features/widgets/dashboard-widgets.tsx apps/frontend/src/features/widgets/dashboard-widgets.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/datapoint-live-hub.ts src/datapoint-live-hub.test.ts src/datapoint-live-http.test.ts src/main.ts src/web-server.ts apps/frontend/src/features/widgets/dashboard-widgets.tsx apps/frontend/src/features/widgets/dashboard-widgets.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format SSE integration"
            git push origin HEAD:feat/nextui-live-events
          fi
